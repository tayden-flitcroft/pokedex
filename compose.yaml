services:
  pokedex:
    image: pokedex:local
    build: .
    container_name: pokedex
    restart: unless-stopped
    ports:
      - '3010:3000'
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
